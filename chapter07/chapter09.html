<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball1{
            width: 100px;
            height: 100px;
            background: pink;
            border-radius: 50%;
            position: relative;
            animation-name: ani1;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            left: 0;
            top: 0;
        }
        @keyframes ani1{
            0%{left: 0; top: 0;}
            10%{left: 80px; top: 80px;}
            20%{left: 160px; top: 0px;}
            30%{left: 240px; top: 80px;}
            40%{left: 320px; top: 0px;}
            50%{left: 400px; top: 80px;}
            60%{left: 480px; top: 0px;}
            70%{left: 560px; top: 80px;}
            80%{left: 640px; top: 0px;}
            90%{left: 720px; top: 80px;}
            100%{left: 800px; top: 0px;}
        }
        .ball2{
            width: 100px;
            height: 100px;
            background: rgb(224, 89, 112);
            border-radius: 50%;
            position: absolute;
            animation-iteration-count: infinite;
            animation: ani2 5s;
            bottom: 0;
            right: 0;
        }
        @keyframes ani2{
            0%{bottom: 0; right: 0;}
            50%{bottom: 50%; right: 0;}
            100%{bottom: 100%; right: 700px;}
        }
        .box{
            width: 100px;
            height: 100px;
            margin: 60px auto;
            animation: rotate 1.5s infinite, background 1.5s infinite alternate;
        }
        @keyframes rotate{
            0%{transform: perspective(120px) rotateX(0deg) rotateY(0deg);}
            50%{transform: perspective(120px) rotateX(-180deg) rotateY(0deg);}
            100%{transform: perspective(120px) rotateX(-180deg) rotateY(-180deg);}
        }
        @keyframes background{
            0%{background: yellowgreen;}
            50%{background: darkolivegreen;}
            100%{background: darkgreen;}
        }
        body{background: gray;}
        .button{
            float: left;
            border: 1px solid #fff;
            padding: 20px 60px;
            position: relative;
            top: 0;
            left: 100px;
            color: #fff;
            width: 150px;
            text-align: center;
            background: #fff;
            overflow: hidden;
            transition: color 1s;
        }
        .button::before{
            content: "";
            position: absolute;
            top: 0%;
            left: -50px;
            width: 0;
            height: 100%;
            text-align: center;
            background: #fff;
            z-index: -1;
            transform: skewX(35deg);
            transition: width 1s;
        }
        .button:hover{
            color: blue;
        }
        .button:hover::before{
            width: 150%;
        }
    </style>
</head>
<body>
    <div class="ball1"></div>
    <div class="ball2"></div>
    <div class="box"></div>
    <div class="button">둘러보기</div>
</body>
</html>
