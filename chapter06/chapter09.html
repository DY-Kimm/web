<!DOCTYPE HTML>
<html>
	<head>
		<title> 테두리 외곽에 아우트라인 처리하기 </title>
		<meta charset="UTF-8" />
		<style type="text/css">
			body{border: 10px solid #000; margin: 20px;}
			div{border: 10px solid palevioletred;}
			p{
				margin: 20px auto;
				width: 350px;
				line-height: 40px;
				padding: 30px;
			}
			.border1{
				font-size: 15px;
				border: 15px solid yellowgreen;
				outline: 2px dotted #000;
			}
			.border2{
				border: 10px double darkolivegreen;
				outline: 10px double darkolivegreen;
			}
		</style>
	</head>

	<body>
		<div>
			<p class="border1">
				Whenever you are asked if you can do a job, tell 
				&quot;Certainly I can!&quot; Then get busy	and find out how to do it. 
				(Theodore Roosevelt)  
			</p>
			<p class="border2">
				당신이 어떤 일을 해낼 수 있는지 누군가가 물어보면 대답해라. 
				&quot;물론이죠!&quot; 그 다음 어떻게 그 일을 해낼 수 있을지 부지런히 고민하라. 
				(시어도어 루스벨트) 
			</p>
		</div>
	</body>
</html>
